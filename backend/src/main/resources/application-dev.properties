# Development profile.
#
# Activate with:  mvn spring-boot:run -Dspring-boot.run.profiles=dev
#  or set SPRING_PROFILES_ACTIVE=dev
#
# This turns on the development-only demo data seeder (patient, doctor, admin accounts,
# specialties, availability and a few appointments). Never enable this in production:
# production runs the default profile, where no seed runs at all.
medbook.demo.seed=true
